[package]
name = "Papan"
version = "0.1.0"
description = "An App for API Client"
authors = ["alifu"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "papan_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = "0.3"
tracing-appender = "0.2"
# The specta family is still pre-release: pin exactly and upgrade the three together.
specta = { version = "=2.0.0-rc.28", features = ["derive"] }
specta-typescript = "=0.0.15"
tauri-specta = { version = "=2.0.0-rc.28", features = ["derive", "typescript"] }
tauri-plugin-dialog = "2.8"
# Pinned exactly: the emitter's output is the on-disk Git format.
serde-saphyr = "=2.1.1"
notify = "8.2"
notify-debouncer-mini = "0.7"
uuid = { version = "1", features = ["v4"] }
tempfile = "3"
