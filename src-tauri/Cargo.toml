[package]
name = "Papan"
version = "0.1.0"
description = "An App for API Client"
authors = ["alifu"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "papan_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = "0.3"
tracing-appender = "0.2"
# The specta family is still pre-release: pin exactly and upgrade the three together.
specta = { version = "=2.0.0-rc.28", features = ["derive"] }
specta-typescript = "=0.0.15"
tauri-specta = { version = "=2.0.0-rc.28", features = ["derive", "typescript"] }
tauri-plugin-dialog = "2.8"
# Pinned exactly: the emitter's output is the on-disk Git format.
serde-saphyr = "=2.1.1"
notify = "8.2"
notify-debouncer-mini = "0.7"
uuid = { version = "1", features = ["v4"] }
tempfile = "3"
# TLS is rustls + aws-lc-rs + the OS trust store (plan 03 §2).
reqwest = { version = "0.13", default-features = false, features = ["rustls", "http2", "charset", "system-proxy", "cookies", "gzip", "brotli", "deflate", "zstd", "multipart", "stream"] }
reqwest_cookie_store = "0.10"
tokio = { version = "1", features = ["rt", "macros", "fs", "io-util", "time", "sync"] }
url = "2"
base64 = "0.23"
encoding_rs = "0.8"
mime = "0.3"
httpdate = "1"
# Vault key in the OS keychain (plan 04 §2, §4). 3.x pinned: a stable three-call API.
keyring = { version = "=3.6.3", default-features = false, features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }
aws-lc-rs = "1"
zeroize = "1"
time = { version = "0.3", features = ["formatting"] }

[dev-dependencies]
axum = { version = "0.8", features = ["multipart"] }
axum-server = { version = "0.9", features = ["tls-rustls"] }
rcgen = "0.14"
flate2 = "1"
futures-util = "0.3"
tokio = { version = "1", features = ["rt-multi-thread", "net"] }
